<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>Video Downloader</title>
<link rel="manifest" href="/manifest.json" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #111214;
    color: #f0f0f0;
    padding: 20px 16px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type="text"] {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1c1d20;
    color: #f0f0f0;
    font-size: 16px;
  }
  button {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: #4f8cff;
    color: white;
    font-size: 16px;
    font-weight: 600;
  }
  button:active { opacity: 0.8; }
  #status { min-height: 20px; color: #aaa; margin-bottom: 8px; }
  #results img {
    width: 100%;
    max-width: 320px;
    border-radius: 10px;
    display: block;
    margin: 10px 0;
  }
  #results h2 { font-size: 17px; margin: 4px 0; }
  .formats { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .format-link {
    display: block;
    padding: 12px;
    border-radius: 10px;
    background: #1c1d20;
    border: 1px solid #333;
    color: #f0f0f0;
    text-decoration: none;
    font-size: 15px;
  }
  .format-link:active { background: #26282c; }
  #keyRow { font-size: 13px; color: #888; margin-top: 24px; }
  #keyRow button { font-size: 12px; padding: 6px 10px; background: #333; }
</style>
</head>
<body>
  <h1>🎬 Video Downloader</h1>

  <div class="row">
    <input type="text" id="urlInput" placeholder="Paste a video link..." autocapitalize="off" autocorrect="off" />
  </div>
  <div class="row">
    <button id="go">Get Info</button>
  </div>

  <div id="status"></div>
  <div id="results"></div>

  <div id="keyRow">
    <span id="keyStatus"></span>
    <button id="changeKey">Change API key</button>
  </div>

<script>
const API_KEY_STORAGE = 'downloaderApiKey';

function getApiKey(forcePrompt) {
  let key = localStorage.getItem(API_KEY_STORAGE);
  if (!key || forcePrompt) {
    key = prompt('Enter your DOWNLOADER_API_KEY (same value you set with export on the server):', key || '');
    if (key) localStorage.setItem(API_KEY_STORAGE, key);
  }
  return key;
}

function updateKeyStatus() {
  const key = localStorage.getItem(API_KEY_STORAGE);
  document.getElementById('keyStatus').textContent = key ? 'API key saved.' : 'No API key set yet.';
}

document.getElementById('changeKey').addEventListener('click', () => {
  getApiKey(true);
  updateKeyStatus();
});

async function extract(url) {
  const key = getApiKey(false);
  const res = await fetch(`/extract?key=${encodeURIComponent(key)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Request failed');
  }
  return res.json();
}

function formatSize(bytes) {
  if (!bytes) return '';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function renderResults(data, url) {
  const key = getApiKey(false);
  const el = document.getElementById('results');
  el.innerHTML = '';

  const title = document.createElement('h2');
  title.textContent = data.title || 'Untitled';
  el.appendChild(title);

  if (data.thumbnail) {
    const img = document.createElement('img');
    img.src = data.thumbnail;
    img.alt = '';
    el.appendChild(img);
  }

  const list = document.createElement('div');
  list.className = 'formats';

  const formats = (data.formats || []).slice().sort((a, b) => (b.filesize || 0) - (a.filesize || 0));

  if (formats.length === 0) {
    const a = document.createElement('a');
    a.className = 'format-link';
    a.textContent = 'Download best available quality';
    a.href = `/download?url=${encodeURIComponent(url)}&format_id=best&key=${encodeURIComponent(key)}`;
    list.appendChild(a);
  }

  formats.forEach(f => {
    const a = document.createElement('a');
    const label = [f.resolution, f.ext, formatSize(f.filesize)].filter(Boolean).join(' · ');
    a.className = 'format-link';
    a.textContent = label || f.format_id;
    a.href = `/download?url=${encodeURIComponent(url)}&format_id=${encodeURIComponent(f.format_id)}&key=${encodeURIComponent(key)}`;
    list.appendChild(a);
  });

  el.appendChild(list);
}

async function runExtract(url) {
  if (!url) return;
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Loading...';
  document.getElementById('results').innerHTML = '';
  try {
    const data = await extract(url);
    statusEl.textContent = '';
    renderResults(data, url);
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message;
  }
}

document.getElementById('go').addEventListener('click', () => {
  runExtract(document.getElementById('urlInput').value.trim());
});

// If opened via "Share" from another app, auto-fill and auto-run.
const params = new URLSearchParams(window.location.search);
const shared = params.get('url') || params.get('text');
if (shared) {
  document.getElementById('urlInput').value = shared;
  runExtract(shared);
}

updateKeyStatus();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
