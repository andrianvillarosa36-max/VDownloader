<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultDL</title>
  <link rel="manifest" href="/static/manifest.json" />
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent: #6c5ce7;
      --accent-hover: #5a4bcf;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --border-color: #2a2a3a;
      --nav-height: 60px;
      --danger: #ff4757;
    }

    [data-theme="light"] {
      --bg-color: #f4f5f8;
      --card-bg: #ffffff;
      --accent: #6c5ce7;
      --accent-hover: #5a4bcf;
      --text-main: #1e1e2d;
      --text-muted: #6c757d;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: calc(var(--nav-height) + 20px); min-height: 100vh; transition: background 0.3s, color 0.3s; }

    header { position: sticky; top: 0; background: rgba(15, 15, 18, 0.95); backdrop-filter: blur(10px); padding: 16px; z-index: 100; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    [data-theme="light"] header { background: rgba(244, 245, 248, 0.95); }
    .brand { font-size: 1.3rem; font-weight: bold; color: var(--accent); }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    /* Reels / TikTok Style Feed for Home Tab */
    #tab-home.active {
      display: block;
      padding: 0;
      height: calc(100vh - var(--nav-height) - 58px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      background: #000;
    }

    .reel-card {
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .reel-overlay {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 70px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 10;
    }

    .reel-title {
      font-size: 1rem;
      font-weight: 600;
      word-break: break-word;
      margin-bottom: 6px;
    }

    .reel-meta {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .reel-play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.5rem;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      z-index: 15;
      display: none;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.6));
    }

    .reel-error-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.55);
      z-index: 18;
      text-align: center;
      padding: 24px;
    }
    .reel-error-overlay.show {
      display: flex;
    }
    .reel-error-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.9rem;
      max-width: 240px;
    }
    .reel-error-remove-btn {
      background: var(--danger, #e5484d);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 9px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Right-Side Action Column */
    .reel-actions {
      position: absolute;
      right: 12px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 20;
    }

    .reel-action-btn {
      background: none;
      border: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: transform 0.15s ease;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
    }

    .reel-action-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reel-action-btn.saved {
      color: var(--accent);
    }

    .reel-action-btn:active {
      transform: scale(0.92);
    }

    .reel-action-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .reel-seek {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 16px;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      z-index: 25;
    }
    .reel-seek::-webkit-slider-runnable-track {
      height: 3px;
      background: linear-gradient(to right, #fff var(--seek-pct, 0%), rgba(255, 255, 255, 0.3) var(--seek-pct, 0%));
    }
    .reel-seek::-moz-range-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
    }
    .reel-seek::-moz-range-progress {
      height: 3px;
      background: #fff;
    }
    .reel-seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      margin-top: -4.5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }
    .reel-seek::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .section-title { font-size: 1.1rem; }

    .search-bar { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; margin-bottom: 14px; }
    .sort-container { display: flex; align-items: center; gap: 8px; }
    .sort-select { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; }

    .settings-card, .downloader-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    
    input[type="text"], select {
      width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; outline: none; font-size: 0.95rem;
    }

    .options-row { display: flex; gap: 12px; }
    .options-row .form-group { flex: 1; }

    button.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    button.btn-danger { width: 100%; background: var(--danger); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    button.btn-secondary { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }

    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
    .setting-item:last-child { border-bottom: none; }
    .setting-label { font-size: 0.9rem; font-weight: 500; }
    .setting-desc { font-size: 0.75rem; color: var(--text-muted); }

    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    .progress-container { display: none; margin-top: 16px; background: var(--bg-color); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
    .progress-bar-bg { width: 100%; background: var(--border-color); height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s ease; }
    .progress-stats { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .video-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .media-thumbnail-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .play-badge { position: absolute; font-size: 2rem; color: #fff; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 50%; backdrop-filter: blur(4px); }
    .video-info { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
    .video-title { font-size: 0.9rem; font-weight: 600; word-break: break-word; line-height: 1.3; }
    .video-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 200; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); background: none; border: none; font-size: 0.75rem; gap: 4px; cursor: pointer; }
    .nav-item.active { color: var(--accent); }

    .player-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: space-between; padding: 16px; }
    .player-overlay.active { display: flex; }
    .player-header { display: flex; justify-content: space-between; align-items: center; color: #fff; }
    .player-title { font-size: 0.95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
    .close-player-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
    .video-container { position: relative; width: 100%; max-width: 900px; margin: auto; }
    video.dedicated-video { width: 100%; border-radius: 8px; max-height: 65vh; background: #000; }
    
    .player-controls { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .timeline-slider { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .controls-row { display: flex; justify-content: space-between; align-items: center; color: #fff; flex-wrap: wrap; gap: 8px; }
    .controls-group { display: flex; align-items: center; gap: 8px; }
    .player-btn { background: none; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; padding: 6px 10px; border-radius: 4px; }
    .player-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .volume-slider { width: 70px; accent-color: var(--accent); cursor: pointer; }
    .speed-select { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px; font-size: 0.8rem; outline: none; }
    .speed-select option { background: var(--card-bg); color: var(--text-main); }
  </style>
</head>
<body>

  <header>
    <div class="brand">VaultDL</div>
  </header>

  <!-- HOME TAB (TikTok / Reels Vertical Scroll) -->
  <section id="tab-home" class="tab-content active"></section>

  <!-- VDOWNLOADER TAB -->
  <section id="tab-vdownloader" class="tab-content">
    <h3 class="section-title" style="margin-bottom: 16px;">VDownloader Workspace</h3>
    
    <div class="downloader-card">
      <div class="form-group">
        <label for="mediaUrl">Media Link</label>
        <input type="text" id="mediaUrl" placeholder="Paste YouTube, TikTok, X, or Telegram URL..." />
      </div>

      <div class="options-row">
        <div class="form-group">
          <label for="formatType">Format</label>
          <select id="formatType">
            <option value="mp4">MP4 (Video)</option>
            <option value="mp3">MP3 (Audio)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quality">Quality</label>
          <select id="quality">
            <option value="best">Best Available</option>
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
          </select>
        </div>
      </div>

      <button class="btn-primary" onclick="startDownload()">Start Download</button>

      <div id="downloadQueueList"></div>
    </div>
  </section>

  <!-- DOWNLOADS TAB -->
  <section id="tab-downloads" class="tab-content">
    <div class="header-row">
      <h3 class="section-title">Offline Library</h3>
      <div class="sort-container">
        <label for="downloadsSort" style="font-size: 0.8rem; margin:0;">Sort:</label>
        <select id="downloadsSort" class="sort-select" onchange="renderDownloadsGrid()">
          <option value="date">Date (Newest)</option>
          <option value="size">File Size</option>
        </select>
      </div>
    </div>
    <input type="text" id="downloadsSearch" class="search-bar" placeholder="🔍 Search offline downloads..." oninput="renderDownloadsGrid()" />
    <div class="video-grid" id="downloadsGrid"></div>
  </section>

  <!-- SETTINGS TAB -->
  <section id="tab-settings" class="tab-content">
    <h3 class="section-title" style="margin-bottom: 16px;">Settings & Preferences</h3>

    <div class="settings-card">
      <h4 style="font-size: 0.95rem; margin-bottom: 10px;">Storage & Vault Space</h4>
      <div class="setting-item">
        <div>
          <div class="setting-label">Vault Usage</div>
          <div class="setting-desc" id="vaultSizeText">Calculating...</div>
        </div>
      </div>
      <div class="setting-item">
        <div>
          <div class="setting-label">Device Free Space</div>
          <div class="setting-desc" id="diskFreeText">Calculating...</div>
        </div>
      </div>
      <button class="btn-danger" style="margin-top: 10px;" onclick="clearAllDownloads()">Clear All Vault Downloads</button>
    </div>

    <div class="settings-card">
      <h4 style="font-size: 0.95rem; margin-bottom: 10px;">Appearance</h4>
      <div class="setting-item">
        <div>
          <div class="setting-label">Light Theme</div>
          <div class="setting-desc">Switch between dark and light workspace</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="themeToggle" onchange="toggleTheme(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="settings-card">
      <h4 style="font-size: 0.95rem; margin-bottom: 10px;">Download Preferences</h4>
      <div class="form-group">
        <label for="defaultQuality">Default Quality Preset</label>
        <select id="defaultQuality" onchange="saveDefaultSettings()">
          <option value="best">Best Available</option>
          <option value="1080p">1080p Full HD</option>
          <option value="720p">720p HD</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label for="defaultFormat">Default Format Preset</label>
        <select id="defaultFormat" onchange="saveDefaultSettings()">
          <option value="mp4">MP4 (Video)</option>
          <option value="mp3">MP3 (Audio)</option>
        </select>
      </div>
    </div>
  </section>

  <!-- DEDICATED PLAYER OVERLAY -->
  <div id="playerOverlay" class="player-overlay">
    <div class="player-header">
      <div id="playerMediaTitle" class="player-title">Now Playing</div>
      <button class="close-player-btn" onclick="closeVideoPlayer()">✕</button>
    </div>

    <div class="video-container">
      <video id="vaultVideoElement" class="dedicated-video" playsinline></video>
    </div>

    <div class="player-controls">
      <input type="range" id="videoSeekBar" class="timeline-slider" value="0" min="0" max="100" oninput="seekVideo(this.value)">
      
      <div class="controls-row">
        <div class="controls-group">
          <button class="player-btn" onclick="rewindVideo(10)">⏪</button>
          <button id="playPauseBtn" class="player-btn" onclick="togglePlayPause()">▶</button>
          <button class="player-btn" onclick="forwardVideo(10)">⏩</button>
        </div>

        <div class="controls-group">
          <button id="muteBtn" class="player-btn" onclick="toggleMute()">🔊</button>
          <input type="range" id="volumeBar" class="volume-slider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
          <select id="speedSelect" class="speed-select" onchange="changePlaybackSpeed(this.value)">
            <option value="0.5">0.5x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
          </select>
        </div>

        <div class="controls-group">
          <div style="font-size: 0.8rem;">
            <span id="currentTimeDisplay">00:00</span> / <span id="totalDurationDisplay">00:00</span>
          </div>
          <button class="player-btn" onclick="togglePiP()">🖼️</button>
          <button class="player-btn" onclick="toggleFullscreen()">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home', this)">
      <span style="font-size: 1.2rem;">🏠</span>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="switchTab('vdownloader', this)">
      <span style="font-size: 1.2rem;">⚡</span>
      <span>VDownloader</span>
    </button>
    <button class="nav-item" onclick="switchTab('downloads', this)">
      <span style="font-size: 1.2rem;">📥</span>
      <span>Downloads</span>
    </button>
    <button class="nav-item" onclick="switchTab('settings', this)">
      <span style="font-size: 1.2rem;">⚙️</span>
      <span>Settings</span>
    </button>
  </nav>

  <script>
    let cachedFiles = [];
    let homeFiles = [];

    function escapeForInlineHandler(str) {
      return String(str)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;');
    }
    let reelObserver = null;
    const playerOverlay = document.getElementById('playerOverlay');
    const videoEl = document.getElementById('vaultVideoElement');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeBar = document.getElementById('volumeBar');
    const seekBar = document.getElementById('videoSeekBar');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const totalDurationDisplay = document.getElementById('totalDurationDisplay');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(err => console.log('SW Error:', err));
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadSettings();
      loadDownloadedMedia();
      loadStorageStats();

      const urlParams = new URLSearchParams(window.location.search);
      const sharedUrl = urlParams.get('url') || urlParams.get('text');
      if (sharedUrl) {
        const downloaderBtn = document.querySelectorAll('.nav-item')[1];
        switchTab('vdownloader', downloaderBtn);
        document.getElementById('mediaUrl').value = sharedUrl;
      }

      videoEl.addEventListener('timeupdate', updateVideoProgress);
      videoEl.addEventListener('loadedmetadata', () => {
        totalDurationDisplay.textContent = formatDuration(videoEl.duration);
        updateMediaSessionPosition();
      });
      videoEl.addEventListener('ended', () => { playPauseBtn.textContent = '▶'; });
    });

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      
      document.getElementById(`tab-${tabId}`).classList.add('active');
      el.classList.add('active');

      if (tabId !== 'home') {
        document.querySelectorAll('.reel-video').forEach(vid => vid.pause());
      }

      if (tabId === 'home' || tabId === 'downloads') {
        loadDownloadedMedia();
      } else if (tabId === 'settings') {
        loadStorageStats();
      }
    }

    function formatDuration(seconds) {
      if (!seconds || isNaN(seconds)) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function initReelObserver() {
      if (reelObserver) reelObserver.disconnect();

      reelObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (video) {
            if (entry.isIntersecting) {
              video.play().catch(() => {});
            } else {
              video.pause();
              video.currentTime = 0;
            }
          }
        });
      }, { threshold: 0.75 });

      document.querySelectorAll('.reel-card').forEach(card => reelObserver.observe(card));
    }

    function toggleReelPlay(cardEl) {
      if (cardEl.querySelector('.reel-error-overlay.show')) return;
      const video = cardEl.querySelector('video');
      const icon = cardEl.querySelector('.reel-play-icon');
      if (video.paused) {
        video.play();
        icon.style.display = 'none';
      } else {
        video.pause();
        icon.style.display = 'block';
      }
    }

    function handleReelVideoError(videoEl) {
      const card = videoEl.closest('.reel-card');
      if (!card) return;
      const overlay = card.querySelector('.reel-error-overlay');
      if (overlay) overlay.classList.add('show');
      const seek = card.querySelector('.reel-seek');
      if (seek) seek.style.display = 'none';
      const playIcon = card.querySelector('.reel-play-icon');
      if (playIcon) playIcon.style.display = 'none';
    }

    async function removeIncomingFile(fileName, btnEl) {
      if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Removing...'; }
      try {
        await fetch(`/incoming/delete?filename=${encodeURIComponent(fileName)}`, { method: 'DELETE' });
      } catch (e) {
        // Fall through — the refresh below reflects whatever the server actually has.
      }
      loadDownloadedMedia();
    }

    function updateReelSeek(videoEl) {
      if (!videoEl.duration || isNaN(videoEl.duration)) return;
      const card = videoEl.closest('.reel-card');
      const seek = card ? card.querySelector('.reel-seek') : null;
      if (!seek || seek.matches(':active')) return; // don't fight the user's drag
      const pct = (videoEl.currentTime / videoEl.duration) * 100;
      seek.value = pct;
      seek.style.setProperty('--seek-pct', pct + '%');
    }

    function seekReel(rangeEl) {
      const card = rangeEl.closest('.reel-card');
      const video = card ? card.querySelector('video') : null;
      if (!video || !video.duration || isNaN(video.duration)) return;
      video.currentTime = (rangeEl.value / 100) * video.duration;
      rangeEl.style.setProperty('--seek-pct', rangeEl.value + '%');
    }

    async function saveToPhone(filePath, fileName, btnEl) {
      const originalText = btnEl ? btnEl.textContent : null;
      if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Saving...'; }

      try {
        const res = await fetch(filePath);
        if (!res.ok) throw new Error('Fetch failed');
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        if (btnEl) btnEl.textContent = '✅ Saved';
      } catch (e) {
        if (btnEl) btnEl.textContent = '❌ Failed';
      } finally {
        setTimeout(() => {
          if (btnEl) { btnEl.textContent = originalText; btnEl.disabled = false; }
        }, 1800);
      }
    }

    async function saveReelVideo(filePath, fileName, btnEl) {
      const label = btnEl ? btnEl.querySelector('.reel-action-label') : null;
      const originalLabel = label ? label.textContent : null;

      if (btnEl) btnEl.disabled = true;
      if (label) label.textContent = 'Saving...';

      // Best-effort copy to the device — this is a bonus on top of the move
      // below, so a failure here shouldn't block moving the file into Downloads.
      try {
        const res = await fetch(filePath);
        if (res.ok) {
          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
        }
      } catch (e) {
        // non-fatal
      }

      try {
        const moveRes = await fetch(`/incoming/save?filename=${encodeURIComponent(fileName)}`, { method: 'POST' });
        if (!moveRes.ok) throw new Error('Move failed');
        if (label) label.textContent = 'Saved';
        if (btnEl) btnEl.classList.add('saved');
        setTimeout(() => loadDownloadedMedia(), 500);
      } catch (e) {
        if (label) label.textContent = 'Failed';
        setTimeout(() => {
          if (label && originalLabel) label.textContent = originalLabel;
          if (btnEl) btnEl.disabled = false;
        }, 1800);
      }
    }

    function openVideoPlayer(filePath, title) {
      document.getElementById('playerMediaTitle').textContent = title;
      videoEl.src = filePath;
      playerOverlay.classList.add('active');
      videoEl.play();
      playPauseBtn.textContent = '⏸';
      setupMediaSession(title);
    }

    function closeVideoPlayer() {
      videoEl.pause();
      videoEl.src = '';
      playerOverlay.classList.remove('active');
      if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
    }

    function togglePlayPause() {
      if (videoEl.paused) { videoEl.play(); playPauseBtn.textContent = '⏸'; }
      else { videoEl.pause(); playPauseBtn.textContent = '▶'; }
    }

    function updateVideoProgress() {
      if (videoEl.duration) {
        seekBar.value = (videoEl.currentTime / videoEl.duration) * 100;
        currentTimeDisplay.textContent = formatDuration(videoEl.currentTime);
        updateMediaSessionPosition();
      }
    }

    function seekVideo(val) { if (videoEl.duration) videoEl.currentTime = (val / 100) * videoEl.duration; }
    function rewindVideo(secs) { videoEl.currentTime = Math.max(0, videoEl.currentTime - secs); }
    function forwardVideo(secs) { videoEl.currentTime = Math.min(videoEl.duration, videoEl.currentTime + secs); }
    function setVolume(val) { videoEl.volume = val; videoEl.muted = (val == 0); muteBtn.textContent = videoEl.muted ? '🔇' : '🔊'; }
    function toggleMute() { videoEl.muted = !videoEl.muted; muteBtn.textContent = videoEl.muted ? '🔇' : '🔊'; volumeBar.value = videoEl.muted ? 0 : videoEl.volume; }
    function changePlaybackSpeed(rate) { videoEl.playbackRate = parseFloat(rate); }

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (document.pictureInPictureEnabled) await videoEl.requestPictureInPicture();
      } catch (err) { alert("PiP Error: " + err.message); }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) videoEl.requestFullscreen().catch(err => alert(err.message));
      else document.exitFullscreen();
    }

    function setupMediaSession(title) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({ title, artist: 'VaultDL', album: 'Offline Media' });
        navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('seekbackward', () => rewindVideo(10));
        navigator.mediaSession.setActionHandler('seekforward', () => forwardVideo(10));
      }
    }

    function updateMediaSessionPosition() {
      if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
        if (videoEl.duration && !isNaN(videoEl.duration)) {
          navigator.mediaSession.setPositionState({
            duration: videoEl.duration,
            playbackRate: videoEl.playbackRate,
            position: videoEl.currentTime
          });
        }
      }
    }

    async function deleteSingleFile(filename) {
      if (!confirm(`Delete "${filename}"?`)) return;
      try {
        const res = await fetch(`/downloads/delete?filename=${encodeURIComponent(filename)}`, { method: 'DELETE' });
        if (res.ok) { loadDownloadedMedia(); loadStorageStats(); }
      } catch (e) { alert("Error deleting file."); }
    }

    async function renameSingleFile(oldName) {
      const newName = prompt("Enter new filename:", oldName);
      if (!newName || newName === oldName) return;
      try {
        const res = await fetch('/downloads/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_filename: oldName, new_filename: newName })
        });
        if (res.ok) loadDownloadedMedia();
        else { const err = await res.json(); alert(err.detail || "Rename failed."); }
      } catch (e) { alert("Error renaming file."); }
    }

    function toggleTheme(isLight) {
      if (isLight) { document.body.setAttribute('data-theme', 'light'); localStorage.setItem('theme', 'light'); }
      else { document.body.removeAttribute('data-theme'); localStorage.setItem('theme', 'dark'); }
    }

    function saveDefaultSettings() {
      const q = document.getElementById('defaultQuality').value;
      const f = document.getElementById('defaultFormat').value;
      localStorage.setItem('defaultQuality', q);
      localStorage.setItem('defaultFormat', f);
      document.getElementById('quality').value = q;
      document.getElementById('formatType').value = f;
    }

    function loadSettings() {
      if (localStorage.getItem('theme') === 'light') {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('themeToggle').checked = true;
      }
      const q = localStorage.getItem('defaultQuality') || 'best';
      const f = localStorage.getItem('defaultFormat') || 'mp4';
      document.getElementById('defaultQuality').value = q;
      document.getElementById('defaultFormat').value = f;
      document.getElementById('quality').value = q;
      document.getElementById('formatType').value = f;
    }

    async function loadStorageStats() {
      try {
        const res = await fetch('/system/storage');
        const data = await res.json();
        document.getElementById('vaultSizeText').textContent = `${data.vault_size_mb} MB (${data.file_count} files)`;
        document.getElementById('diskFreeText').textContent = `${data.disk_free_gb} GB free`;
      } catch (e) { document.getElementById('vaultSizeText').textContent = "Unavailable"; }
    }

    async function clearAllDownloads() {
      if (confirm("Delete ALL files from VaultDL?")) {
        try {
          const res = await fetch('/downloads/clear', { method: 'DELETE' });
          if (res.ok) { loadDownloadedMedia(); loadStorageStats(); }
        } catch (e) { alert("Error clearing files."); }
      }
    }

    async function startDownload() {
      const urlInput = document.getElementById('mediaUrl');
      const url = urlInput.value.trim();
      const formatType = document.getElementById('formatType').value;
      const quality = document.getElementById('quality').value;
      const queueList = document.getElementById('downloadQueueList');

      if (!url) { alert("Paste a valid media URL."); return; }

      const taskId = "task_" + Date.now();
      urlInput.value = "";

      queueList.insertAdjacentHTML('beforeend', `
        <div class="progress-container" style="display:block;" data-task-id="${taskId}">
          <div class="progress-stats">
            <span class="row-label" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;">${url}</span>
            <span class="row-percent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="row-bar-fill progress-bar-fill"></div>
          </div>
          <div class="progress-stats">
            <span class="row-status">Queued...</span>
            <span class="row-eta">ETA: --s</span>
          </div>
          <button class="btn-danger row-cancel-btn" style="margin-top: 10px;">Cancel</button>
        </div>
      `);

      const row = queueList.querySelector(`[data-task-id="${taskId}"]`);
      const barFill = row.querySelector('.row-bar-fill');
      const percentEl = row.querySelector('.row-percent');
      const statusEl = row.querySelector('.row-status');
      const etaEl = row.querySelector('.row-eta');
      const cancelBtn = row.querySelector('.row-cancel-btn');
      cancelBtn.onclick = () => cancelQueuedDownload(taskId, cancelBtn);

      const eventSource = new EventSource(`/download/progress/${taskId}`);
      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.status === 'queued') {
          statusEl.textContent = `Queued — position ${data.queue_position || 1}`;
        } else if (data.status === 'starting') {
          statusEl.textContent = 'Starting...';
        } else if (data.status === 'downloading') {
          barFill.style.width = `${data.percent}%`;
          percentEl.textContent = `${data.percent}%`;
          statusEl.textContent = `Downloading — ${data.downloaded_mb || 0} MB / ${data.total_mb || 0} MB`;
          etaEl.textContent = `ETA: ${data.eta_seconds || 0}s`;
        } else if (data.status === 'cancelling') {
          statusEl.textContent = 'Cancelling...';
          cancelBtn.disabled = true;
        } else if (data.status === 'cancelled') {
          statusEl.textContent = 'Cancelled';
          cancelBtn.style.display = 'none';
          eventSource.close();
          setTimeout(() => row.remove(), 2500);
        } else if (data.status === 'finished') {
          barFill.style.width = '100%';
          percentEl.textContent = '100%';
          statusEl.textContent = 'Completed!';
          cancelBtn.style.display = 'none';
          eventSource.close();
          loadDownloadedMedia();
          setTimeout(() => row.remove(), 2500);
        } else if (data.status === 'error') {
          statusEl.textContent = data.error || 'Download error';
          cancelBtn.style.display = 'none';
          eventSource.close();
        }
      };

      try {
        const res = await fetch(`/download?url=${encodeURIComponent(url)}&format_type=${formatType}&quality=${quality}&task_id=${taskId}`, { method: 'POST' });
        if (!res.ok) {
          statusEl.textContent = "Failed to start download server request";
          cancelBtn.style.display = 'none';
          eventSource.close();
        }
      } catch (err) {
        statusEl.textContent = "Network Error";
        cancelBtn.style.display = 'none';
        eventSource.close();
      }
    }

    async function cancelQueuedDownload(taskId, btnEl) {
      if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Cancelling...'; }
      try {
        await fetch(`/download/cancel/${taskId}`, { method: 'POST' });
      } catch (err) {
        // The SSE stream will still reflect the real state once the server catches up.
      }
    }

    async function loadDownloadedMedia() {
      try {
        const [incomingRes, downloadsRes] = await Promise.all([
          fetch('/incoming/list'),
          fetch('/downloads/list')
        ]);
        homeFiles = await incomingRes.json();
        cachedFiles = await downloadsRes.json();
        renderHomeFeed();
        renderDownloadsGrid();
      } catch (e) {
        const errHTML = '<p style="color: var(--text-muted); padding: 20px;">Failed to load media.</p>';
        document.getElementById('tab-home').innerHTML = errHTML;
        document.getElementById('downloadsGrid').innerHTML = errHTML;
      }
    }

    function renderHomeFeed() {
      const hGrid = document.getElementById('tab-home');
      const videoFiles = (homeFiles || []).filter(f => f.ext !== 'MP3');

      if (videoFiles.length === 0) {
        hGrid.innerHTML = '<p style="color: var(--text-muted); padding: 20px;">Nothing new yet — download something from VDownloader and it\'ll show up here.</p>';
        return;
      }

      hGrid.innerHTML = videoFiles.map(file => {
        const escapedTitle = escapeForInlineHandler(file.name);
        return `
          <div class="reel-card" onclick="toggleReelPlay(this)">
            <video class="reel-video" src="${file.path}" loop playsinline
                   ontimeupdate="updateReelSeek(this)"
                   onerror="handleReelVideoError(this)"></video>
            <div class="reel-play-icon">▶</div>

            <div class="reel-error-overlay">
              <div class="reel-error-text">This video can't be played — it may be corrupted or incomplete.</div>
              <button class="reel-error-remove-btn" onclick="event.stopPropagation(); removeIncomingFile('${escapedTitle}', this)">Remove</button>
            </div>

            <div class="reel-actions" onclick="event.stopPropagation()">
              <button class="reel-action-btn" onclick="saveReelVideo('${file.path}', '${escapedTitle}', this)">
                <span class="reel-action-icon">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </span>
                <span class="reel-action-label">Save</span>
              </button>
            </div>

            <div class="reel-overlay">
              <div class="reel-title">${file.name}</div>
              <div class="reel-meta">${file.size_mb} MB • ${file.ext}</div>
            </div>

            <input type="range" class="reel-seek" min="0" max="100" value="0" step="0.1"
                   onclick="event.stopPropagation()"
                   oninput="seekReel(this)">
          </div>
        `;
      }).join('');

      initReelObserver();
    }

    function renderDownloadsGrid() {
      const dGrid = document.getElementById('downloadsGrid');

      if (!cachedFiles || cachedFiles.length === 0) {
        dGrid.innerHTML = '<p style="color: var(--text-muted); padding: 20px;">No media saved yet.</p>';
        return;
      }

      const sortMode = document.getElementById('downloadsSort') ? document.getElementById('downloadsSort').value : 'date';
      const searchQuery = (document.getElementById('downloadsSearch') ? document.getElementById('downloadsSearch').value : '').toLowerCase().trim();

      let filteredFiles = cachedFiles.filter(f => f.name.toLowerCase().includes(searchQuery) || f.ext.toLowerCase().includes(searchQuery));
      filteredFiles.sort((a, b) => sortMode === 'size' ? b.size_bytes - a.size_bytes : b.timestamp - a.timestamp);

      if (filteredFiles.length === 0) {
        dGrid.innerHTML = '<p style="color: var(--text-muted); padding: 20px;">No matching files found.</p>';
        return;
      }

      dGrid.innerHTML = filteredFiles.map(file => {
        const isAudio = file.ext === 'MP3';
        const escapedTitle = escapeForInlineHandler(file.name);
        const mediaPreview = isAudio
          ? `<div class="media-thumbnail-wrapper"><span style="font-size:3rem;">🎵</span></div>`
          : `<div class="media-thumbnail-wrapper" onclick="openVideoPlayer('${file.path}', '${escapedTitle}')"><span class="play-badge">▶</span></div>`;

        return `
          <div class="video-card">
            ${mediaPreview}
            <div class="video-info">
              <div class="video-title">${file.name}</div>
              <div class="video-meta">
                <span>Size: ${file.size_mb} MB</span>
                <span>Type: ${file.ext}</span>
              </div>
              <div style="display:flex; gap:6px; margin-top:4px;">
                <button onclick="openVideoPlayer('${file.path}', '${escapedTitle}')" class="btn-primary" style="flex:1;">Play</button>
                <button onclick="renameSingleFile('${escapedTitle}')" class="btn-secondary">✏️ Edit</button>
                <button onclick="deleteSingleFile('${escapedTitle}')" class="btn-danger" style="width:auto; padding:8px 12px;">🗑️</button>
              </div>
              <button onclick="saveToPhone('${file.path}', '${escapedTitle}', this)" class="btn-secondary" style="width:100%; margin-top:6px;">📲 Save to phone</button>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
