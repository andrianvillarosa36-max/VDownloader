<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vault Player</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icon.png">
    
    <!-- Plyr CSS for Native Player UI -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --bg: #0b0f19;
            --card: #151c2c;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --border: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .app-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .header h2 { margin: 0; font-size: 1.3rem; font-weight: 700; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 1.2rem;
            border-radius: 16px;
            margin-bottom: 1.25rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        .form-group { margin-bottom: 0.85rem; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.05em; }
        
        .url-input-group { display: flex; gap: 0.5rem; }
        input[type="url"], select {
            width: 100%;
            padding: 0.85rem;
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        input[type="url"]:focus { border-color: var(--accent); }

        button {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        button.primary { background: var(--accent); color: white; width: 100%; padding: 0.9rem; font-size: 1rem; }
        button.paste-btn { background: #1e293b; color: white; white-space: nowrap; }
        button.save { background: var(--success); color: white; font-size: 0.8rem; }
        button.saved { background: #334155; color: #94a3b8; font-size: 0.8rem; cursor: default; }
        button.danger { background: var(--danger); color: white; font-size: 0.8rem; }
        button.play-btn { background: #0284c7; color: white; font-size: 0.8rem; }
        button:disabled { opacity: 0.5; }

        .progress-container { display: none; margin-top: 1rem; }
        .progress-bar-bg { width: 100%; background: #1e293b; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #2563eb, #38bdf8); transition: width 0.2s; }
        .progress-stats { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--subtext); margin-top: 0.4rem; }

        #status { margin-top: 1rem; padding: 0.6rem; border-radius: 8px; text-align: center; font-size: 0.85rem; }
        .success { background: #064e3b; color: #6ee7b7; }
        .error { background: #7f1d1d; color: #fca5a5; }

        .history-item { border-bottom: 1px solid var(--border); padding: 0.85rem 0; }
        .history-item:last-child { border-bottom: none; }
        .history-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-meta { font-size: 0.75rem; color: var(--subtext); margin: 0.25rem 0 0.6rem 0; }
        .history-actions { display: flex; gap: 0.4rem; align-items: center; }

        /* Fullscreen Player Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }
        .modal-content {
            width: 95%;
            max-width: 550px;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .modal-close {
            background: var(--danger);
            color: white;
            border-radius: 50%;
            width: 32px; height: 32px;
            text-align: center; line-height: 32px;
            cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="app-icon">⚡</div>
        <h2>Vault Downloader</h2>
    </div>

    <div class="card">
        <div class="form-group">
            <label for="videoUrl">Media Link</label>
            <div class="url-input-group">
                <input type="url" id="videoUrl" placeholder="Paste Twitter, Instagram, YouTube URL..." required>
                <button class="paste-btn" onclick="pasteClipboard()">Paste</button>
            </div>
        </div>
        <div class="form-group">
            <label for="formatType">Format</label>
            <select id="formatType" onchange="toggleQualityDropdown()">
                <option value="mp4">Video (MP4)</option>
                <option value="mp3">Audio Only (MP3)</option>
            </select>
        </div>
        <div class="form-group" id="qualityGroup">
            <label for="quality">Resolution</label>
            <select id="quality">
                <option value="best">Best Available</option>
                <option value="1080">1080p</option>
                <option value="720">720p</option>
                <option value="480">480p</option>
            </select>
        </div>
        <button id="downloadBtn" class="primary" onclick="startDownload()">Start Download</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <span id="progressPercent">0%</span>
                <span id="progressSpeed">0 KB/s</span>
                <span id="progressEta">ETA: --</span>
            </div>
        </div>

        <div id="status"></div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; font-size: 1.05rem;">Internal App Vault</h3>
        <div id="historyList">Loading media...</div>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h4 id="modalTitle" style="margin: 0; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%;">Playing</h4>
                <div class="modal-close" onclick="closePlayer()">✕</div>
            </div>
            <video id="player" controls playsinline></video>
        </div>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        let plyrPlayer = null;

        document.addEventListener("DOMContentLoaded", () => {
            plyrPlayer = new Plyr('#player', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
                settings: ['quality', 'speed']
            });
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }

        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws/progress`);

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const container = document.getElementById("progressContainer");
            const fill = document.getElementById("progressFill");
            const percentStr = document.getElementById("progressPercent");
            const speedStr = document.getElementById("progressSpeed");
            const etaStr = document.getElementById("progressEta");

            if (data.status === "downloading") {
                container.style.display = "block";
                fill.style.width = `${data.percentage}%`;
                percentStr.innerText = `${data.percentage}%`;
                speedStr.innerText = data.speed;
                etaStr.innerText = `ETA: ${data.eta}`;
            } else if (data.status === "processing") {
                percentStr.innerText = "Processing...";
            }
        };

        async function pasteClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById("videoUrl").value = text;
            } catch (err) {
                alert("Please grant clipboard access.");
            }
        }

        function toggleQualityDropdown() {
            const format = document.getElementById("formatType").value;
            document.getElementById("qualityGroup").style.display = (format === "mp3") ? "none" : "block";
        }

        function openPlayer(url, title) {
            const modal = document.getElementById("videoModal");
            document.getElementById("modalTitle").innerText = title;
            
            plyrPlayer.source = {
                type: 'video',
                title: title,
                sources: [{ src: url, type: 'video/mp4' }]
            };
            
            modal.style.display = "flex";
            plyrPlayer.play();

            // Android Lock Screen & Notification Shade Integration
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: 'App Vault Media',
                    album: 'Vault Downloader'
                });
            }
        }

        function closePlayer() {
            const modal = document.getElementById("videoModal");
            plyrPlayer.stop();
            modal.style.display = "none";
        }

        async function loadHistory() {
            const historyList = document.getElementById("historyList");
            try {
                const res = await fetch("/history");
                const items = await res.json();

                if (items.length === 0) {
                    historyList.innerHTML = "<p style='color: var(--subtext);'>Vault is empty.</p>";
                    return;
                }

                historyList.innerHTML = items.map(item => `
                    <div class="history-item">
                        <div class="history-title">${item.title}</div>
                        <div class="history-meta">${item.format_type.toUpperCase()} • ${item.quality} • ${new Date(item.downloaded_at).toLocaleDateString()}</div>
                        <div class="history-actions">
                            <button class="play-btn" onclick="openPlayer('/files/${encodeURIComponent(item.filename)}', '${item.title.replace(/'/g, "\\'")}')">▶ Play</button>
                            ${item.is_saved_to_phone 
                                ? `<button class="saved" disabled>Saved</button>`
                                : `<button class="save" onclick="saveToPhone(${item.id})">Save to Phone</button>`
                            }
                            <button class="danger" onclick="deleteItem(${item.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                historyList.innerHTML = "<p style='color: var(--danger);'>Failed to load history.</p>";
            }
        }

        async function startDownload() {
            const url = document.getElementById("videoUrl").value;
            const format_type = document.getElementById("formatType").value;
            const quality = document.getElementById("quality").value;
            const btn = document.getElementById("downloadBtn");
            const status = document.getElementById("status");
            const progressContainer = document.getElementById("progressContainer");

            if (!url) {
                status.className = "error";
                status.innerText = "Please enter a valid URL";
                return;
            }

            btn.disabled = true;
            status.className = "";
            status.innerText = "Downloading...";
            progressContainer.style.display = "block";

            try {
                const response = await fetch("/download", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url, format_type, quality })
                });

                const data = await response.json();
                if (response.ok) {
                    status.className = "success";
                    status.innerText = `Downloaded: ${data.filename}`;
                    document.getElementById("videoUrl").value = "";
                    loadHistory();
                } else {
                    status.className = "error";
                    status.innerText = `Error: ${data.detail}`;
                }
            } catch (err) {
                status.className = "error";
                status.innerText = "Connection error.";
            } finally {
                btn.disabled = false;
                setTimeout(() => { progressContainer.style.display = "none"; }, 3000);
            }
        }

        async function saveToPhone(id) {
            const status = document.getElementById("status");
            try {
                const res = await fetch(`/save-to-phone/${id}`, { method: "POST" });
                const data = await res.json();
                if (res.ok) {
                    status.className = "success";
                    status.innerText = "Exported to Phone Storage!";
                    loadHistory();
                } else {
                    status.className = "error";
                    status.innerText = `Export failed: ${data.detail}`;
                }
            } catch (err) {
                status.className = "error";
                status.innerText = "Failed to export.";
            }
        }

        async function deleteItem(id) {
            if (!confirm("Delete permanently from Vault?")) return;
            await fetch(`/history/${id}`, { method: "DELETE" });
            loadHistory();
        }

        loadHistory();
    </script>
</body>
</html>
